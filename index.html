<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .con{
            height: 100vh;
            background: linear-gradient(90deg, skyblue, purple);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        form{
            height: 70%;
            width: 30%;
            background-color: white;
            border-radius: 20px;
        }
        .user,.password,.login{
            /* border: 1px solid black; */
            width: 80%;
            margin: auto;
            margin-top: 50px;
        }
        input{
            width: 100%;
            height: 30px;
            /* background-color: lightgrey; */
            border: 1px solid lightgrey;
            border-radius: 8px;
        }
        button{
            height: 40px;
            width: 100%;
            background: linear-gradient(90deg, skyblue, purple);
            border: none;
            color: white;
            border-radius: 10px;
        }
        h1{
            margin-top: 30px;
        }
        .password>p{
            color: grey;
        }
        input,p{
            margin-top: 2%;
            margin-bottom: 4%;
        }
    </style>
</head>
<body>
    <div class="con">
        <form action="">
            <h1 align="center"><b>Login Form</b></h1>
            <div class="user">
                <label for=""><b>Email or Phone</b></label>
                <input type="email" placeholder="xyz@gmail.com">
            </div>
            <div class="password">
                <label for=""><b>Password</b></label>
                <input type="password" placeholder="xyz@123">
                <p><i>Forget Password?</i></p>
            </div>
            <div class="login">
                <button><b>Login</b></button>
                <p align="center">Not a Member? <a href="signup.html"><i>Sign Up Now</i></a></p>
            </div>
        </form>
    </div>
</body>
</html>
